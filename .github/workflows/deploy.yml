name: deploy

# Publishes the tagged build to the S3 bucket behind CloudFront (open-projects-hub-infra).
# Trigger: push a tag vX.Y.Z, or run manually from a tag ref to redeploy it.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  verify-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require a vX.Y.Z tag
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag || ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Run this workflow from a vX.Y.Z tag (got $GITHUB_REF_TYPE $GITHUB_REF_NAME)." >&2
            exit 1
          fi

      - name: Require the SITE_URL repository variable
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          # Checked up front: the smoke test at the end would otherwise fail after prod changed.
          if [ -z "$SITE_URL" ]; then
            echo "Set the SITE_URL repository variable (https://<cloudfront domain>)." >&2
            exit 1
          fi

      # Tag protection limits who can tag, not what is tagged. main only receives merged pull
      # requests, which ran CI.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the tagged commit to be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points at a commit that is not on main. Merge it into main first." >&2
            exit 1
          fi

  deploy:
    needs: verify-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    env:
      WEB_BUCKET: ${{ vars.WEB_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      # .env.production leaves VITE_API_BASE_URL empty: the app calls /v1 on its own CloudFront origin.
      - run: npm run build

      - name: Drop bundle report
        run: rm -f dist/stats.html

      # Hashed file name of this build's entry script; the smoke test looks for it on the site.
      - name: Remember the built entry script
        run: echo "ENTRY_SCRIPT=$(grep -o 'assets/index-[^"]*\.js' dist/index.html | head -1)" >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Hashed assets first so index.html never points at a file that is not uploaded yet.
      # Old hashes are kept: browsers holding a cached index.html still request them.
      - name: Upload hashed assets
        run: |
          aws s3 sync dist/assets "s3://$WEB_BUCKET/assets" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload index.html and public files
        run: |
          aws s3 sync dist "s3://$WEB_BUCKET" --exclude "assets/*" --delete \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" --paths "/*" \
            --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" --id "$invalidation_id"

      # The page must reference this build's hashed entry script, which an older deploy cannot.
      - name: Smoke test through CloudFront
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          test -n "$ENTRY_SCRIPT"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$SITE_URL/" -o served.html
          grep -qF "$ENTRY_SCRIPT" served.html

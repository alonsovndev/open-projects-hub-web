name: ci

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts skips the husky `prepare` hook, which only matters on developer machines.
      - run: npm ci --ignore-scripts

      # lint + unit tests + type-check + build. Playwright E2E needs the API and is not run here.
      - run: npm run verify

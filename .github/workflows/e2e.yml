name: E2E Tests

# Manual only: the specs log in against a real, seeded API (see e2e/fixtures/test-users.ts),
# which CI does not provision. Point api_base_url at a running backend with those users.
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Base URL of a running, seeded open-projects-hub-api"
        required: true
        default: "http://127.0.0.1:8000"

jobs:
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ inputs.api_base_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
